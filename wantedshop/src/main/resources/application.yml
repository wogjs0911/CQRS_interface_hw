spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wanteddb
    username: root
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # 또는 validate, update, create, create-drop
      naming:
        physical-strategy: com.wanted.wantedshop.config.SnakeCasePhysicalNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hibernate.default_batch_fetch_size: 1000    # 연관된 엔티티를 배치로 로딩
        hibernate.fetchSize: 1000                   # 단일 쿼리에서 한 번에 1000개 행 가져오기


  # optional: logging tuning for SQL (dev only)
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace


server:
  port: 8081