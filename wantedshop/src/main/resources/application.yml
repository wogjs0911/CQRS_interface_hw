spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wanteddb
    username: root
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # 또는 validate, update, create, create-drop
      naming:
        physical-strategy: com.wanted.wantedshop.config.SnakeCasePhysicalNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


  # optional: logging tuning for SQL (dev only)
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
